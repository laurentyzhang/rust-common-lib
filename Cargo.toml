[package]
name = "rust-common-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
im = "15.0.0"
alloy-rlp = "0.3.16"
alloy-primitives = { version = "1.6.1", features = ["rlp"] }
alloy-evm = "0.38.0"
alloy-op-evm = { git = "https://github.com/ethereum-optimism/optimism", branch = "develop" }
alloy-op-hardforks = { git = "https://github.com/ethereum-optimism/optimism", branch = "develop" }
op-alloy = { git = "https://github.com/ethereum-optimism/optimism", branch = "develop" }
op-revm = { git = "https://github.com/ethereum-optimism/optimism", branch = "develop" }
rayon = "1.11.0"
quick_cache = { path = "../../quick-cache" }

[dev-dependencies]
foyer-memory = "0.22.4"
moka = { version = "0.12.16", features = ["sync"] }
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[[bench]]
name = "cache_comparison"
harness = false

[[bench]]
name = "hasher_comparison"
harness = false

[[bench]]
name = "accumulator_sorting"
harness = false

[[bench]]
name = "conflict_detection"
harness = false
